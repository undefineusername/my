<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 축하합니다!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f8f8f8;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .birthday-text {
            animation: fadeInScale 1.5s ease-out forwards;
            opacity: 0;
        }

        .birthday-text h1 {
            font-size: 4rem;
            color: #1a1a1a;
            margin-bottom: 20px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .birthday-text p {
            font-size: 1.3rem;
            color: #666666;
            font-weight: 400;
            opacity: 0.9;
            animation: fadeInUp 1.5s ease-out 0.5s forwards;
            opacity: 0;
            line-height: 1.6;
        }

        .countdown {
            font-size: 0.95rem;
            color: #999999;
            margin-top: 15px;
            font-weight: 500;
            animation: fadeInUp 1.5s ease-out 0.7s forwards;
            opacity: 0;
        }

        .birthday-text .emoji {
            font-size: 3rem;
            display: none;
        }

        /* Play 버튼 스타일 */
        .play-btn {
            margin-top: 80px;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            background: #2a2a2a;
            border: 2px solid #2a2a2a;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
            animation: slideUp 0.8s ease-out;
        }

        .play-btn:hover {
            background: #ffffff;
            color: #2a2a2a;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .play-btn:active {
            transform: translateY(-1px);
        }

        /* Credit text */
        .credit {
            font-size: 0.6rem;
            color: rgba(0, 0, 0, 0.3);
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-weight: 400;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 색종이 */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            animation: confettiFall 3s ease-in forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* 풍선 */
        .balloon {
            position: fixed;
            width: 40px;
            height: 50px;
            border-radius: 50% 50% 50% 0;
            pointer-events: none;
            animation: balloonRise 4s ease-in forwards;
        }

        .balloon1 {
            background: #e0e0e0;
        }

        .balloon2 {
            background: #d4d4d4;
        }

        .balloon3 {
            background: #cccccc;
        }

        .balloon4 {
            background: #dadada;
        }

        @keyframes balloonRise {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 별 */
        .star {
            position: fixed;
            pointer-events: none;
            font-size: 2rem;
            animation: starTwinkle 2s ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.2);
            }
        }

        /* spectacular effect overlay and animations */
        .effect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            animation: flashEffect 0.3s ease-out;
            pointer-events: none;
            z-index: 9999;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            animation: particleExplode 2s ease-out forwards;
        }

        .heart {
            position: fixed;
            pointer-events: none;
            font-size: 2rem;
            animation: heartFloat 3s ease-out forwards;
        }

        .sparkle {
            position: fixed;
            pointer-events: none;
            animation: sparkleEffect 1.5s ease-out forwards;
        }

        @keyframes flashEffect {
            0% {
                opacity: 0.5;
            }
            100% {
                opacity: 0;
            }
        }

        @keyframes particleExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        @keyframes heartFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh) scale(0.5);
            }
        }

        @keyframes sparkleEffect {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--sx), var(--sy)) scale(0);
            }
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .birthday-text h1 {
                font-size: 2.5rem;
            }

            .birthday-text p {
                font-size: 1.1rem;
            }

            .birthday-text .emoji {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="birthday-text">
            <h1>(미리)생 축!</h1>
            <p>신민진님의 생일을 진심으로 축하드립니당</p>
            <div id="countdown" class="countdown" aria-live="polite"></div>
            <button class="play-btn" onclick="startCelebration()">???</button>
        </div>
    </div>
    
    <p class="credit">made by dan's
        30분걸림ㅋ
    </p>

    <script>
        // Update countdown to tomorrow 00:00 every second
        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            let diff = tomorrow - now;
            if (diff < 0) diff = 0;

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const el = document.getElementById('countdown');
            if (el) {
                el.textContent = `내일까지 ${hours}시간 ${minutes}분 ${seconds}초`;
            }
        }

        function createConfetti() {
            const confettiPieces = 50;
            for (let i = 0; i < confettiPieces; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * window.innerWidth + 'px';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = 
                        ['#999999', '#808080', '#a8a8a8', '#888888', '#777777', '#919191']
                        [Math.floor(Math.random() * 6)];
                    confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 3500);
                }, i * 30);
            }
        }

        function createBalloon() {
            const balloonTypes = ['balloon1', 'balloon2', 'balloon3', 'balloon4'];
            const balloonCount = 8;

            for (let i = 0; i < balloonCount; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon ' + balloonTypes[Math.floor(Math.random() * 4)];
                    balloon.style.left = Math.random() * window.innerWidth + 'px';
                    balloon.style.bottom = '0';
                    balloon.style.animationDelay = (Math.random() * 0.5) + 's';
                    document.body.appendChild(balloon);

                    setTimeout(() => balloon.remove(), 4500);
                }, i * 200);
            }
        }

        function createStars() {
            const stars = ['✨', '⭐', '💫'];
            for (let i = 0; i < 15; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.textContent = stars[Math.floor(Math.random() * 3)];
                star.style.left = Math.random() * window.innerWidth + 'px';
                star.style.top = Math.random() * window.innerHeight + 'px';
                star.style.animationDelay = (Math.random() * 2) + 's';
                document.body.appendChild(star);
            }
        }

        function createSpectacularEffects() {
            // Flash effect
            const flash = document.createElement('div');
            flash.className = 'flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 300);

            // Create particles from center
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    const colors = ['#999999', '#808080', '#a8a8a8', '#888888', '#777777', '#919191'];
                    particle.style.left = (window.innerWidth / 2) + 'px';
                    particle.style.top = (window.innerHeight / 2) + 'px';
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.width = (Math.random() * 8 + 4) + 'px';
                    particle.style.height = (Math.random() * 8 + 4) + 'px';
                    particle.style.borderRadius = '50%';
                    
                    const angle = (Math.random() * Math.PI * 2);
                    const distance = Math.random() * 800 + 300;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    particle.style.setProperty('--tx', tx + 'px');
                    particle.style.setProperty('--ty', ty + 'px');
                    
                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 2000);
                }, i * 10);
            }

            // Create floating hearts
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.textContent = '💖';
                    heart.style.left = Math.random() * window.innerWidth + 'px';
                    heart.style.top = (window.innerHeight / 2) + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 3000);
                }, i * 50);
            }

            // Create sparkles
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    sparkle.textContent = '✨';
                    sparkle.style.left = Math.random() * window.innerWidth + 'px';
                    sparkle.style.top = Math.random() * window.innerHeight + 'px';
                    
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 400;
                    const sx = Math.cos(angle) * distance;
                    const sy = Math.sin(angle) * distance;
                    sparkle.style.setProperty('--sx', sx + 'px');
                    sparkle.style.setProperty('--sy', sy + 'px');
                    
                    document.body.appendChild(sparkle);
                    setTimeout(() => sparkle.remove(), 1500);
                }, i * 15);
            }
        }

        window.addEventListener('load', () => {
            createStars();
            updateCountdown();
            setInterval(updateCountdown, 1000);
        });

        function startCelebration() {
            createSpectacularEffects();
            createConfetti();
            createBalloon();
        }
    </script>
</body>
</html>
